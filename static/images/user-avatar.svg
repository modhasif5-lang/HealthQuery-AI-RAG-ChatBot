    <!-- Torso / Shoulders Geometric Form -->
    <path d="M 16 51 C 16 41, 23 36.5, 32 36.5 C 41 36.5, 48 41, 48 51 C 48 52.5, 47 53.5, 45 53.5 L 19 53.5 C 17 53.5, 16 52.5, 16 51 Z" 
