<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="medBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0369a1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="32" cy="32" r="32" fill="url(#medBgGrad)"/>

  <!-- Inner Geometric Ring Accent -->
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Geometric Medical Cross -->
  <g filter="url(#softGlow)">
    <!-- Vertical Bar -->
    <rect x="27" y="15" width="10" height="34" rx="4" fill="url(#crossGrad)"/>
    <!-- Horizontal Bar -->
    <rect x="15" y="27" width="34" height="10" rx="4" fill="url(#crossGrad)"/>
  </g>

  <!-- Center Geometric Pulse / Heartbeat Wave Accent -->
  <path d="M 18 32 L 24 32 L 27.5 24 L 32.5 39.5 L 36.5 26.5 L 39.5 34 L 41.5 32 L 46 32" 
        fill="none" 
        stroke="#0284c7" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>

